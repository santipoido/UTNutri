@let paciente = this.paciente();

@if (paciente) {
  <div class="form-page">
    <div class="form-card">
      <h1 class="form-title">
        {{ esEdicion() ? 'Reprogramar turno' : 'Agendar turno' }}
      </h1>
      <p class="form-sub">
        Paciente: <strong>{{ paciente.nombre }}</strong>
      </p>

      <form [formGroup]="form" (ngSubmit)="handleSubmit()">

        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label" for="fecha">Fecha</label>
            <input class="form-input" type="date" id="fecha" formControlName="fecha" />
          </div>
          <div class="form-group">
            <label class="form-label" for="hora">Hora</label>
            <input class="form-input" type="time" id="hora" formControlName="hora" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="observaciones">Observaciones</label>
          <input class="form-input" type="text" id="observaciones" formControlName="observaciones" placeholder="ej. Realizar mediciones estándar" />
        </div>

        <button class="btn btn-primary btn-full" type="submit">
          {{ esEdicion() ? 'Actualizar turno' : 'Agendar turno' }}
        </button>

      </form>
    </div>
  </div>
}
