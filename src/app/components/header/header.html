<header class="app-header">
  <nav class="header-nav">

    <div class="header-logo">
      <span class="logo-dot"></span>
      UTNutri
    </div>

    <div class="header-links">
      <a routerLink="/turnos"          routerLinkActive="active" class="nav-link">Dashboard</a>
      <a routerLink="/calendario"      routerLinkActive="active" class="nav-link">Calendario</a>
      <a routerLink="/pacientes"       routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-link">Pacientes</a>
      <a routerLink="/pacientes/nuevo" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-link">Nuevo paciente</a>
    </div>

    <div class="header-user">
      @if (auth.getNombre()) {
        <div class="user-info">
          <span class="user-name">{{ auth.getNombre() }}</span>
          <span class="user-role">Nutricionista</span>
        </div>
        <div class="user-avatar" [attr.aria-label]="'Avatar de ' + auth.getNombre()">{{ initiales }}</div>
      }
      <button class="btn-logout" (click)="auth.logout()">Salir</button>
    </div>

  </nav>
</header>
