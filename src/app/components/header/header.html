<header class="app-header">
  <nav class="header-nav">

    <div class="header-logo">
      <span class="logo-dot"></span>
      UTNutri
    </div>

    <button
      class="hamburger-btn"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menú">
      <svg viewBox="0 0 24 24" fill="none" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <div class="header-links" [class.header-links-open]="menuOpen()">
      <a routerLink="/turnos"          routerLinkActive="active" class="nav-link" (click)="closeMenu()">Turnos</a>
      <a routerLink="/calendario"      routerLinkActive="active" class="nav-link" (click)="closeMenu()">Calendario</a>
      <a routerLink="/pacientes"       routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-link" (click)="closeMenu()">Pacientes</a>
      <a routerLink="/pacientes/nuevo" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-link" (click)="closeMenu()">Nuevo paciente</a>
    </div>

    <div class="header-user">
      @if (auth.getNombre()) {
        <div class="user-info">
          <span class="user-name">{{ auth.getNombre() }}</span>
          <span class="user-role">Nutricionista</span>
        </div>
        <a routerLink="/perfil" class="user-avatar" [attr.aria-label]="'Ir al perfil de ' + auth.getNombre()" title="Mi perfil">{{ initiales }}</a>
      }
      <button class="btn-logout" (click)="auth.logout()">Salir</button>
    </div>

  </nav>
</header>
