<header>
    <nav>
        <div class="contenedor-logo">
            <h3>UTNutri</h3>
        </div>
        <div class="contenedor-links">
            <a routerLink="/turnos" routerLinkActive="active">Inicio</a>
            <a routerLink="/pacientes" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Pacientes</a>
            <a routerLink="/pacientes/nuevo" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Nuevo paciente</a>
        </div>
        <div class="contenedor-usuario">
            @if (auth.getNombre()) {
                <span class="nombre-usuario">{{ auth.getNombre() }}</span>
            }
            <button class="btn-logout" (click)="auth.logout()">Cerrar sesión</button>
        </div>
    </nav>
</header>
