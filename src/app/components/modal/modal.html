@if (visible) {
  <div class="modal-overlay" (click)="cancelled.emit()">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-dialog-title" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <span class="modal-title" id="modal-dialog-title">{{ title }}</span>
        <button class="modal-close" aria-label="Cerrar" (click)="cancelled.emit()">✕</button>
      </div>
      <p class="modal-body">{{ message }}</p>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-sm" (click)="cancelled.emit()">{{ cancelLabel }}</button>
        <button
          class="btn btn-sm"
          [class.btn-danger]="type === 'danger'"
          [class.btn-primary]="type !== 'danger'"
          (click)="confirmed.emit()">
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
