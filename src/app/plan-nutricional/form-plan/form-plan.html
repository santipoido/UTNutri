<div class="form-page">
  <button class="btn-back" (click)="volver()">
    <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Volver al plan
  </button>
  <div class="form-header">
    <h1 class="form-title">Plan nutricional</h1>
    <p class="form-sub">Completá el plan semanal del paciente.</p>
  </div>

  @if (errorMsg) {
    <div class="alert-error">{{ errorMsg }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="handleSubmit()" class="plan-form">

    <div class="plan-field-card">
      <div class="plan-field-header">
        <div class="plan-icon-sm">☕</div>
        <label class="plan-field-label" for="desayuno">Desayuno</label>
      </div>
      <textarea class="form-textarea" id="desayuno" formControlName="desayuno" rows="3" placeholder="Ej: 2 huevos revueltos + tostadas integrales"></textarea>
    </div>

    <div class="plan-field-card">
      <div class="plan-field-header">
        <div class="plan-icon-sm">🍽️</div>
        <label class="plan-field-label" for="almuerzo">Almuerzo</label>
      </div>
      <textarea class="form-textarea" id="almuerzo" formControlName="almuerzo" rows="3" placeholder="Ej: Ensalada + pechuga de pollo"></textarea>
    </div>

    <div class="plan-field-card">
      <div class="plan-field-header">
        <div class="plan-icon-sm">🥐</div>
        <label class="plan-field-label" for="merienda">Merienda</label>
      </div>
      <textarea class="form-textarea" id="merienda" formControlName="merienda" rows="2" placeholder="Ej: Yogur natural + fruta"></textarea>
    </div>

    <div class="plan-field-card">
      <div class="plan-field-header">
        <div class="plan-icon-sm">🌙</div>
        <label class="plan-field-label" for="cena">Cena</label>
      </div>
      <textarea class="form-textarea" id="cena" formControlName="cena" rows="3" placeholder="Ej: Verduras salteadas + pescado"></textarea>
    </div>

    <div class="plan-field-card">
      <div class="plan-field-header">
        <div class="plan-icon-sm">🍎</div>
        <label class="plan-field-label" for="snacks">Snacks</label>
      </div>
      <textarea class="form-textarea" id="snacks" formControlName="snacks" rows="2" placeholder="Ej: Frutos secos, barras proteicas"></textarea>
    </div>

    <div class="plan-field-card">
      <label class="plan-field-label" for="notas">Notas adicionales</label>
      <textarea class="form-textarea" id="notas" formControlName="notas" rows="4" placeholder="Restricciones, calorías objetivo, observaciones..."></textarea>
    </div>

    <div class="form-submit-row">
      <button class="btn btn-primary" type="submit" [disabled]="form.pristine || form.invalid">
        Guardar cambios
      </button>
    </div>

  </form>
</div>
